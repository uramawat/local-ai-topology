name: Validate catalog

on:
  pull_request:
    paths:
      - "data/**"
      - "scripts/**"
      - ".github/workflows/validate-catalog.yml"
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/**"

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run catalog:build
      - run: node scripts/validate-evidence.mjs
      - run: git diff --exit-code -- public/catalog/v1.json data/generated/catalog-index.json data/generated/artifact-review-queue.v1.json
